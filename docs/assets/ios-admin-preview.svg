<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <!-- Dark and Red Gradients -->
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="40%" stop-color="#09090C" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <linearGradient id="gymRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2424" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <linearGradient id="cardGlowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#280C0E" />
      <stop offset="60%" stop-color="#180B0D" />
      <stop offset="100%" stop-color="#100809" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FF4D4D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.1" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="redBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2424" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E50914" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B30006" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for High-End Glow -->
    <filter id="neonGlowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF1E27" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#E50914" flood-opacity="0.35" />
    </filter>

    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      @keyframes radarPing {
        0% { r: 3.5px; opacity: 1; }
        70% { r: 10px; opacity: 0; }
        100% { r: 10px; opacity: 0; }
      }
      @keyframes cardBorderPulse {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      @keyframes chartDraw {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes islandWave {
        0%, 100% { height: 6px; y: 41px; }
        50% { height: 14px; y: 37px; }
      }
      @keyframes subtleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      .pulse-radar { animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .border-pulse { animation: cardBorderPulse 2.8s ease-in-out infinite; }
      .chart-line { stroke-dasharray: 260; stroke-dashoffset: 0; animation: chartDraw 2.4s ease-out forwards; }
      .wave-bar-1 { animation: islandWave 1.2s ease-in-out infinite; }
      .wave-bar-2 { animation: islandWave 1.2s ease-in-out 0.25s infinite; }
      .wave-bar-3 { animation: islandWave 1.2s ease-in-out 0.5s infinite; }
      .float-card { animation: subtleFloat 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Phone Body (Apple iPhone Titanium Frame) -->
  <rect x="10" y="10" width="400" height="840" rx="52" fill="#18181D" stroke="#2D2D38" stroke-width="3.5" filter="url(#phoneShadow)" />
  <rect x="12" y="12" width="396" height="836" rx="50" fill="none" stroke="#000000" stroke-width="2" />
  
  <!-- OLED Screen Display Area -->
  <rect x="16" y="16" width="388" height="828" rx="46" fill="url(#adminBg)" />

  <!-- iOS Dynamic Island Container -->
  <rect x="144" y="27" width="132" height="34" rx="17" fill="#000000" />
  <!-- Camera lens cutout -->
  <circle cx="254" cy="44" r="5.5" fill="#14141A" />
  <circle cx="254" cy="44" r="2.5" fill="#07070A" />
  <!-- Animated Live Sound/Activity Wave in Dynamic Island -->
  <rect x="162" y="41" width="3" height="6" rx="1.5" fill="#E50914" class="wave-bar-1" />
  <rect x="168" y="38" width="3" height="12" rx="1.5" fill="#FF3B30" class="wave-bar-2" />
  <rect x="174" y="40" width="3" height="8" rx="1.5" fill="#E50914" class="wave-bar-3" />
  <text x="184" y="48" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">ERP LIVE</text>

  <!-- iOS Status Bar -->
  <text x="44" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600" letter-spacing="-0.3">9:41</text>
  <!-- Cellular Signal -->
  <rect x="340" y="43" width="3" height="5" rx="1" fill="#FFFFFF" />
  <rect x="345" y="40" width="3" height="8" rx="1" fill="#FFFFFF" />
  <rect x="350" y="37" width="3" height="11" rx="1" fill="#FFFFFF" />
  <rect x="355" y="34" width="3" height="14" rx="1" fill="#FFFFFF" />
  <!-- Battery Indicator -->
  <rect x="366" y="38" width="23" height="11" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  <rect x="368" y="40" width="16" height="7" rx="2" fill="#34D399" />
  <path d="M 390 42 C 390.8 42.5, 390.8 44.5, 390 45" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Top Navigation Header -->
  <text x="36" y="102" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">GYM MANAGEMENT ERP</text>
  <text x="36" y="130" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.6">Brother&apos;s Fitness</text>
  
  <!-- Live Animated Status Badge -->
  <rect x="290" y="110" width="94" height="26" rx="13" fill="#240A0D" stroke="#E50914" stroke-width="1.2" />
  <circle cx="305" cy="123" r="6" fill="#E50914" opacity="0.35" class="pulse-radar" />
  <circle cx="305" cy="123" r="3.5" fill="#FF2424" />
  <text x="317" y="127" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">ONLINE</text>

  <!-- Hero KPI Card: Active Trainees (Gym Red Glow + Animated Border) -->
  <g class="float-card">
    <rect x="36" y="152" width="348" height="142" rx="26" fill="url(#cardGlowBg)" stroke="url(#redBorderGlow)" stroke-width="1.6" filter="url(#neonGlowRed)" class="border-pulse" />
    
    <!-- Shimmer Highlight Layer -->
    <rect x="36" y="152" width="348" height="142" rx="26" fill="url(#shimmerGrad)" opacity="0.12" />

    <text x="56" y="184" fill="#F87171" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">TOTAL ACTIVE TRAINEES</text>
    <text x="56" y="234" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">184</text>
    
    <!-- Growth Metric Pill -->
    <rect x="156" y="206" width="94" height="22" rx="11" fill="#0D2E1C" stroke="#10B981" stroke-width="1" />
    <path d="M 166 218 L 171 213 L 176 218" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="180" y="221" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">+12 this mo</text>
    
    <!-- Animated SVG Trainee Growth Curve -->
    <path d="M 240 248 C 265 238, 280 246, 305 218 C 325 194, 345 220, 364 190" fill="none" stroke="url(#gymRedGrad)" stroke-width="3.5" stroke-linecap="round" class="chart-line" />
    <circle cx="364" cy="190" r="4.5" fill="#FFFFFF" stroke="#E50914" stroke-width="2.5" />
    
    <text x="56" y="268" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Projected Renewal Revenue: ₹1,42,000</text>
  </g>

  <!-- Quick Action Buttons -->
  <rect x="36" y="310" width="108" height="42" rx="14" fill="url(#gymRedGrad)" />
  <text x="56" y="336" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">+ Member</text>

  <rect x="156" y="310" width="108" height="42" rx="14" fill="#181820" stroke="#2E2E3C" stroke-width="1.2" />
  <text x="178" y="336" fill="#F4F4F5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">WhatsApp</text>

  <rect x="276" y="310" width="108" height="42" rx="14" fill="#181820" stroke="#2E2E3C" stroke-width="1.2" />
  <text x="300" y="336" fill="#F4F4F5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Export CSV</text>

  <!-- Member Directory Header -->
  <text x="36" y="388" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Trainee Directory</text>
  <text x="332" y="388" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">See all (184)</text>

  <!-- Member 1: Aarav Sharma (Active) -->
  <rect x="36" y="404" width="348" height="68" rx="18" fill="#131318" stroke="#242430" stroke-width="1.2" />
  <circle cx="70" cy="438" r="19" fill="#2E0E12" stroke="#E50914" stroke-width="1.5" />
  <text x="61" y="443" fill="#FF4D4D" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">AS</text>
  <text x="102" y="431" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Aarav Sharma</text>
  <text x="102" y="450" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11">Quarterly Plan • 45d left • Evening</text>
  <rect x="296" y="426" width="66" height="24" rx="12" fill="#0E281A" stroke="#10B981" stroke-width="1" />
  <text x="309" y="442" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">ACTIVE</text>

  <!-- Member 2: Rohan Patel (Active) -->
  <rect x="36" y="482" width="348" height="68" rx="18" fill="#131318" stroke="#242430" stroke-width="1.2" />
  <circle cx="70" cy="516" r="19" fill="#1C1C24" stroke="#3F3F4E" stroke-width="1.5" />
  <text x="61" y="521" fill="#D4D4D8" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">RP</text>
  <text x="102" y="509" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Rohan Patel</text>
  <text x="102" y="528" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11">Monthly Plan • 14d left • Morning</text>
  <rect x="296" y="504" width="66" height="24" rx="12" fill="#0E281A" stroke="#10B981" stroke-width="1" />
  <text x="309" y="520" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">ACTIVE</text>

  <!-- Member 3: Priya Verma (Expiring Soon - Amber/Red) -->
  <rect x="36" y="560" width="348" height="68" rx="18" fill="#181316" stroke="#E50914" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="70" cy="594" r="19" fill="#340E12" stroke="#EF4444" stroke-width="1.5" />
  <text x="61" y="599" fill="#FF4D4D" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">PV</text>
  <text x="102" y="587" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Priya Verma</text>
  <text x="102" y="606" fill="#F87171" font-family="-apple-system, sans-serif" font-size="11">Half-Yearly • Expires in 3 days!</text>
  <rect x="286" y="582" width="76" height="24" rx="12" fill="#321808" stroke="#F59E0B" stroke-width="1" />
  <text x="294" y="598" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">EXPIRING</text>

  <!-- Automated Daily Snapshot Notification Card -->
  <rect x="36" y="644" width="348" height="62" rx="18" fill="#151216" stroke="#2B2024" stroke-width="1.2" />
  <circle cx="62" cy="675" r="12" fill="#2E0E12" />
  <path d="M 58 675 L 61 678 L 67 671" stroke="#EF4444" stroke-width="2" fill="none" stroke-linecap="round" />
  <text x="84" y="669" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Automated Daily Snapshot Synced</text>
  <text x="84" y="687" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11">Encrypted backup mirrored to Supabase • 05:30 AM</text>

  <!-- iOS Bottom Tab Bar (Frosted Obsidian) -->
  <rect x="16" y="736" width="388" height="108" rx="0" fill="#0C0C10" stroke="#1E1E28" stroke-width="1" />
  
  <!-- Tab 1: Dashboard (Active in Gym Red) -->
  <circle cx="72" cy="764" r="14" fill="#320C10" />
  <path d="M 68 764 L 72 760 L 76 764 L 76 768 L 68 768 Z" fill="#E50914" />
  <text x="48" y="785" fill="#E50914" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">Dashboard</text>

  <!-- Tab 2: Members -->
  <circle cx="152" cy="764" r="7" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="131" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Members</text>

  <!-- Tab 3: Leads -->
  <rect x="226" y="758" width="16" height="12" rx="2" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="219" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Leads</text>

  <!-- Tab 4: Analytics -->
  <path d="M 304 770 L 308 762 L 312 766 L 316 758" fill="none" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
  <text x="294" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Analytics</text>

  <!-- Tab 5: Settings -->
  <circle cx="366" cy="764" r="6" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="348" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Settings</text>

  <!-- iOS Home Indicator Bar -->
  <rect x="140" y="828" width="140" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.75" />
</svg>
