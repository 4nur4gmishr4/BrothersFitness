<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <!-- Dark and Gym Red Gradients -->
    <linearGradient id="fuelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="40%" stop-color="#09090C" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <linearGradient id="fuelGymRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2424" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <linearGradient id="fuelCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#280C0F" />
      <stop offset="60%" stop-color="#160A0D" />
      <stop offset="100%" stop-color="#0E0709" />
    </linearGradient>

    <linearGradient id="fuelShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FF4D4D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.1" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="fuelBorderPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2424" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#E50914" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#B30006" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neonFuelRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF1E27" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#E50914" flood-opacity="0.35" />
    </filter>

    <filter id="phoneShadowFuel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      @keyframes radarPingFuel {
        0% { r: 3.5px; opacity: 1; }
        70% { r: 10px; opacity: 0; }
        100% { r: 10px; opacity: 0; }
      }
      @keyframes borderGlowPulse {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.95; }
      }
      @keyframes macroExpand {
        0% { width: 0px; }
        100% { width: 148px; }
      }
      @keyframes islandWaveFuel {
        0%, 100% { height: 6px; y: 41px; }
        50% { height: 14px; y: 37px; }
      }
      @keyframes livePulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .pulse-fuel { animation: radarPingFuel 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .border-pulse-fuel { animation: borderGlowPulse 2.8s ease-in-out infinite; }
      .wave-fuel-1 { animation: islandWaveFuel 1.2s ease-in-out infinite; }
      .wave-fuel-2 { animation: islandWaveFuel 1.2s ease-in-out 0.3s infinite; }
      .wave-fuel-3 { animation: islandWaveFuel 1.2s ease-in-out 0.6s infinite; }
      .pulse-dot { animation: livePulseDot 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Phone Body (Apple iPhone Titanium Frame) -->
  <rect x="10" y="10" width="400" height="840" rx="52" fill="#18181D" stroke="#2D2D38" stroke-width="3.5" filter="url(#phoneShadowFuel)" />
  <rect x="12" y="12" width="396" height="836" rx="50" fill="none" stroke="#000000" stroke-width="2" />
  
  <!-- OLED Screen Display Area -->
  <rect x="16" y="16" width="388" height="828" rx="46" fill="url(#fuelBg)" />

  <!-- iOS Dynamic Island Container -->
  <rect x="144" y="27" width="132" height="34" rx="17" fill="#000000" />
  <!-- Camera lens cutout -->
  <circle cx="254" cy="44" r="5.5" fill="#14141A" />
  <circle cx="254" cy="44" r="2.5" fill="#07070A" />
  <!-- Animated Live AI Audio/Activity Wave -->
  <rect x="160" y="41" width="3" height="6" rx="1.5" fill="#E50914" class="wave-fuel-1" />
  <rect x="166" y="38" width="3" height="12" rx="1.5" fill="#FF3B30" class="wave-fuel-2" />
  <rect x="172" y="40" width="3" height="8" rx="1.5" fill="#E50914" class="wave-fuel-3" />
  <text x="182" y="48" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">AI MACRO</text>

  <!-- iOS Status Bar -->
  <text x="44" y="49" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600" letter-spacing="-0.3">9:41</text>
  <!-- Cellular Signal -->
  <rect x="340" y="43" width="3" height="5" rx="1" fill="#FFFFFF" />
  <rect x="345" y="40" width="3" height="8" rx="1" fill="#FFFFFF" />
  <rect x="350" y="37" width="3" height="11" rx="1" fill="#FFFFFF" />
  <rect x="355" y="34" width="3" height="14" rx="1" fill="#FFFFFF" />
  <!-- Battery Indicator -->
  <rect x="366" y="38" width="23" height="11" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  <rect x="368" y="40" width="16" height="7" rx="2" fill="#34D399" />
  <path d="M 390 42 C 390.8 42.5, 390.8 44.5, 390 45" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Top App Navigation Bar -->
  <text x="36" y="102" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">AI NUTRITION SYNTHESIZER</text>
  <text x="36" y="130" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.6">Tactical Fuel Protocol</text>
  
  <!-- Active Protocol Badge with Pulsing Ping -->
  <rect x="282" y="110" width="102" height="26" rx="13" fill="#240A0D" stroke="#E50914" stroke-width="1.2" />
  <circle cx="297" cy="123" r="6" fill="#E50914" opacity="0.35" class="pulse-fuel" />
  <circle cx="297" cy="123" r="3.5" fill="#FF2424" />
  <text x="309" y="127" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.4">BULK 3.0</text>

  <!-- Hero Caloric and Macro Target Card (Gym Red Glow + Animated Shimmer) -->
  <g>
    <rect x="36" y="152" width="348" height="154" rx="26" fill="url(#fuelCardBg)" stroke="url(#fuelBorderPulseGrad)" stroke-width="1.6" filter="url(#neonFuelRed)" class="border-pulse-fuel" />
    <rect x="36" y="152" width="348" height="154" rx="26" fill="url(#fuelShimmer)" opacity="0.12" />
    
    <text x="56" y="182" fill="#F87171" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">DAILY CALORIC GOAL</text>
    <text x="56" y="226" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="-1">2,850</text>
    <text x="176" y="216" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">kcal / day</text>

    <!-- Macro Bar 1: Protein -->
    <text x="56" y="254" fill="#F4F4F5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Protein (175g / 180g)</text>
    <rect x="56" y="260" width="140" height="7" rx="3.5" fill="#262632" />
    <rect x="56" y="260" width="134" height="7" rx="3.5" fill="url(#fuelGymRed)" />

    <!-- Macro Bar 2: Carbs -->
    <text x="216" y="254" fill="#F4F4F5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Carbs (330g / 350g)</text>
    <rect x="216" y="260" width="148" height="7" rx="3.5" fill="#262632" />
    <rect x="216" y="260" width="138" height="7" rx="3.5" fill="#E50914" />

    <!-- Macro Bar 3: Healthy Fats -->
    <text x="56" y="284" fill="#F4F4F5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Fats (68g / 70g)</text>
    <rect x="56" y="290" width="308" height="7" rx="3.5" fill="#262632" />
    <rect x="56" y="290" width="298" height="7" rx="3.5" fill="#B30006" />
  </g>

  <!-- Action Row: PDF Export and AI Recalibrate -->
  <rect x="36" y="322" width="168" height="42" rx="14" fill="url(#fuelGymRed)" />
  <text x="64" y="348" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Download PDF</text>

  <rect x="216" y="322" width="168" height="42" rx="14" fill="#181820" stroke="#2E2E3C" stroke-width="1.2" />
  <text x="246" y="348" fill="#F4F4F5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Regenerate AI</text>

  <!-- Section Header: Today's Protocol Timeline -->
  <text x="36" y="398" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Daily Meal Schedule</text>
  <text x="318" y="398" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Swap item</text>

  <!-- Meal Row 1: Pre-Workout (Eaten) -->
  <rect x="36" y="414" width="348" height="72" rx="18" fill="#131318" stroke="#242430" stroke-width="1.2" />
  <circle cx="70" cy="450" r="19" fill="#241416" stroke="#E50914" stroke-width="1.5" />
  <text x="61" y="455" fill="#FF4D4D" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">M1</text>
  <text x="102" y="442" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Pre-Workout Fuel</text>
  <text x="102" y="460" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11">Rolled Oats, Whey Isolate, Banana • 620 kcal</text>
  <text x="102" y="475" fill="#F87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">42g Protein • 85g Carbs</text>
  <rect x="302" y="438" width="68" height="24" rx="12" fill="#0E281A" stroke="#10B981" stroke-width="1" />
  <text x="314" y="454" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">EATEN</text>

  <!-- Meal Row 2: Post-Workout Bowl (Active NOW with live pulse) -->
  <rect x="36" y="498" width="348" height="74" rx="18" fill="#181215" stroke="#E50914" stroke-width="1.4" />
  <circle cx="70" cy="535" r="19" fill="#340E12" stroke="#EF4444" stroke-width="1.5" />
  <text x="61" y="540" fill="#FF4D4D" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">M2</text>
  <text x="102" y="527" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Post-Workout Anabolic Bowl</text>
  <text x="102" y="545" fill="#D4D4D8" font-family="-apple-system, sans-serif" font-size="11">Soya Chunks / Paneer, Brown Rice, Curd • 780 kcal</text>
  <text x="102" y="561" fill="#F87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">54g Protein • 92g Carbs</text>
  <rect x="302" y="523" width="68" height="24" rx="12" fill="#320C10" stroke="#E50914" stroke-width="1.2" />
  <circle cx="314" cy="535" r="3.5" fill="#FF2424" class="pulse-dot" />
  <text x="324" y="539" fill="#FECACA" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">NOW</text>

  <!-- Meal Row 3: Sustained Evening Meal -->
  <rect x="36" y="584" width="348" height="72" rx="18" fill="#131318" stroke="#242430" stroke-width="1.2" />
  <circle cx="70" cy="620" r="19" fill="#1C1C24" stroke="#3F3F4E" stroke-width="1.5" />
  <text x="61" y="625" fill="#D4D4D8" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">M3</text>
  <text x="102" y="612" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Sustained Evening Meal</text>
  <text x="102" y="630" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11">Multigrain Roti, Dal Tadka, Greek Yogurt • 650 kcal</text>
  <text x="102" y="645" fill="#F87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">38g Protein • 78g Carbs</text>
  <rect x="302" y="608" width="68" height="24" rx="12" fill="#1A1A22" stroke="#3F3F4E" stroke-width="1" />
  <text x="317" y="624" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">NEXT</text>

  <!-- Micro Hydration Tracker -->
  <rect x="36" y="668" width="348" height="50" rx="16" fill="#14141A" stroke="#242430" stroke-width="1.2" />
  <text x="56" y="698" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Hydration Target: 3.2L / 4.0L</text>
  <rect x="236" y="688" width="132" height="6" rx="3" fill="#262632" />
  <rect x="236" y="688" width="105" height="6" rx="3" fill="#E50914" />

  <!-- iOS Bottom Tab Bar (Frosted Obsidian) -->
  <rect x="16" y="736" width="388" height="108" rx="0" fill="#0C0C10" stroke="#1E1E28" stroke-width="1" />
  
  <!-- Tab 1: Workouts -->
  <circle cx="72" cy="764" r="7" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="50" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Workouts</text>

  <!-- Tab 2: Fuel (Active in Gym Red) -->
  <circle cx="152" cy="764" r="14" fill="#320C10" />
  <path d="M 148 765 L 152 759 L 156 765 Z" fill="#E50914" />
  <text x="141" y="785" fill="#E50914" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">Fuel</text>

  <!-- Tab 3: Progress -->
  <rect x="226" y="758" width="16" height="12" rx="2" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="212" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Progress</text>

  <!-- Tab 4: Hydration -->
  <circle cx="308" cy="764" r="6" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="289" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Hydration</text>

  <!-- Tab 5: Profile -->
  <circle cx="366" cy="764" r="6" fill="none" stroke="#71717A" stroke-width="1.5" />
  <text x="350" y="785" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Coach</text>

  <!-- iOS Home Indicator Bar -->
  <rect x="140" y="828" width="140" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.75" />
</svg>
